name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub web UI

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build Xcode Project
        working-directory: Builds/iOS
        run: |
          echo "Starting xcodebuild..."
          xcodebuild clean build \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package into IPA
        working-directory: Builds/iOS
        run: |
          mkdir -p Payload
          # Copy compiled .app bundle into Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -qr VirtualStrikeZone.ipa Payload
          echo "Successfully created VirtualStrikeZone.ipa!"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualStrikeZone-iOS-IPA
          path: Builds/iOS/VirtualStrikeZone.ipa
          retention-days: 7
